<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="json/manifest.json">
    <link rel="icon" type="image/png" href="icons/icon192.png">
    <link rel="stylesheet" href="css/messages.css">
    <link rel="stylesheet" href="css/style.css"> <!-- Assuming this is your general styles -->
    <link rel="stylesheet" href="css/modals.css"> <!-- Assuming this is for modals (can be merged or separate) -->
    <title>Messages</title>
    <!-- Load Socket.IO client from your Node.js server -->
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
</head>
<body>
    <header>
        <div class="right">
            <button id="burger-btn" class="burger-btn"><span class="burger-char">☰</span></button>
            <div class="logo"><a href="index.html" class="logo_redir">CMS</a></div>
        </div>
        <div class="right">
            <div class="hd_item">
                <div class="bell-container notification-show">
                    <div class="bell-wrapper"><img class="bell_img" src="./icons/bell.png" alt="Notifications"><div class="red-ball"></div></div>
                    <div class="bell-notifications">
                        <div class="notification-item"><img class="notification-icon" src="./icons/user.png" alt="User Icon"><div class="notification-content"><span class="notification-name">John Doe</span><span class="notification-message">Submitted assignment</span></div></div>
                        <div class="notification-item"><img class="notification-icon" src="./icons/user.png" alt="User Icon"><div class="notification-content"><span class="notification-name">Jane Smith</span><span class="notification-message">Requested feedback</span></div></div>
                    </div>
                </div>
            </div>
            <div class="hd_item a_wrapper">
                <div class="user"><img class="user_img" src="./icons/user.png" alt="User Avatar"><div class="user_name"><a>James Bond</a></div></div>
                <div class="account_menu_modal">
                    <span class="aml_option">Settings</span>
                    <button class="account_but"><span class="aml_option" id="logout-btn">Log out</span></button>
                </div>
            </div>
        </div>
    </header>

    <div class="below_header">
        <aside id="sidebar">
            <nav>
                <ul>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="index.html">Students</a></li>
                    <li><a href="task.html">Tasks</a></li>
                     <li><a href="message.html">Messages</a></li> <!-- Added Messages link for navigation -->
                </ul>
            </nav>
        </aside>

        <main>
            <div class="messanger-container">
                <div class="chat-list">
                    <div class="chat-list-header">
                        <input type="search" class="chat-search-bar" placeholder="Search or start new chat...">
                        <button class="add-chat-btn" id="openAddChatModalBtn" title="New Chat">+</button>
                        <button class="chat-list-close-btn" id="closeChatListBtn" title="Close">×</button>
                    </div>
                    <div class="chat-list-body">
                        <div class="chat-list-empty-placeholder">
                            <p class="empty-chat-text">
                                No active conversations.<br>
                                Search for groups or users to start a new chat.
                            </p>
                        </div>
                        <div class="chat-list-items" style="display: none;">
                            <!-- Chat items will be dynamically populated by JS -->
                        </div>
                    </div>
                </div>
                <div class="chat-container">
                    <div class="chat-header">
                        <button class="chat-list-toggle-btn" title="Toggle Chat List">☰</button>
                        <div class="chat-header-info">
                            <span class="chat-header-name">Select a chat to start messaging</span>
                            <div class="chat-header-participants">
                                <!-- Participant avatars will be added here -->
                            </div>
                        </div>
                    </div>
                    <div class="chat-messages-area">
                        <div class="no-chat-selected">
                            <p>Select a chat from the list to view messages</p>
                        </div>
                    </div>
                    <div class="chat-input-area">
                        <textarea class="message-input" placeholder="Type a message..." rows="1"></textarea>
                        <button class="send-message-btn" title="Send Message">
                            <span>Send</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Add New Chat Modal -->
    <div id="addChatModalOverlay" class="modal-overlay" style="display: none;">
        <div class="modal-dialog">
            <div class="modal-header-title">
                <h3>New Chat</h3>
                <button id="closeAddChatModalBtn" class="modal-close-btn" title="Close">×</button>
            </div>
            <div class="add-chat-container">
                <div class="chat-name-section">
                    <label for="newGroupNameInput">Group Name</label>
                    <input type="text" id="newGroupNameInput" placeholder="Enter group name" required>
                </div>
                <div class="selected-students-section">
                    <label>Selected Students</label>
                    <div class="selected-students-container">
                        <div class="selected-students-avatars" id="selectedStudentsAvatars">
                            <!-- Selected student avatars will be displayed here -->
                        </div>
                    </div>
                </div>
                <div class="add-users-container">
                    <input type="search" id="searchStudentsInput" placeholder="Search students to add...">
                    <div class="students-list" id="studentsSearchResults">
                        <!-- Student search results will be dynamically populated by JS -->
                    </div>
                </div>
                <div class="new-chat-actions">
                    <button id="cancelNewChatBtn" class="btn-cancel">Cancel</button>
                    <button id="confirmNewChatBtn" class="btn-confirm" disabled>Create Chat</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load your application script AFTER Socket.IO client -->
    <script type="module" src="js/messages_app.js"></script>
    <!-- Assuming button.js is needed for burger_menu -->
    <script type="module" src="js/button.js"></script> 
</body>
</html>
